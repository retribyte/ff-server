name: CI / Deploy

# PRs: typecheck + tests. Push to main: the same, then deploy to NearlyFreeSpeech
# with scripts/deploy-nfsn.sh (see docs/deploy-nfsn.md).
#
# SCHEMA CHANGES: a PR that changes prisma/schema.prisma adds a SQL file under
# prisma/prod-sql/. The `schema` job lints it and proves on a scratch Postgres that
# it gives exactly the new schema; the deploy then backs up the database and applies
# it on the host (through the jobs queue) before uploading the new code. See
# prisma/prod-sql/README.md.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm test
      - run: scripts/test-tag-release.sh

  # PRs only, and a required check: does prisma/prod-sql/ turn the base branch's
  # schema into this branch's schema? (scripts/verify-schema-sql.sh; skips fast
  # when neither the schema nor the SQL changed.)
  schema:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: scripts/test-apply-prod-sql.sh
      - run: scripts/verify-schema-sql.sh "origin/${{ github.base_ref }}"

  # Main only, before the deploy so the build sees the tag: every merge gets the next
  # release tag, a minor or major one if the PR's title or description says [minor] or
  # [major], otherwise a patch. See docs/versioning.md.
  version:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # push the tag
      pull-requests: read
    concurrency:
      group: tag-release-ff-server
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tags
      - name: Tag a release if the merged PR asks for one
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The PR that produced this commit (empty for a direct push)
          PR_TEXT="$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '[.[] | select(.merged_at != null)][0] // empty | "\(.title)\n\n\(.body // "")"')"
          export PR_TEXT
          scripts/tag-release.sh

  deploy:
    needs: [test, version]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    # Longer than the slowest real path: a migration's 10-minute wait, plus npm ci
    # on the host when the lockfile changes.
    timeout-minutes: 30
    # One deploy at a time; a newer push waits rather than cancelling mid-upload
    concurrency:
      group: deploy-nfsn-ff-server
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, for the version in the build (scripts/write-version.mjs)
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: SSH key and pinned host key
        env:
          NFSN_DEPLOY_KEY: ${{ secrets.NFSN_DEPLOY_KEY }}
          NFSN_KNOWN_HOSTS: ${{ secrets.NFSN_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$NFSN_DEPLOY_KEY" > ~/.ssh/nfsn_deploy
          chmod 600 ~/.ssh/nfsn_deploy
          printf '%s\n' "$NFSN_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy
        env:
          NFSN_SSH: ${{ vars.NFSN_SSH }}
        run: |
          export NFSN_KEY="$HOME/.ssh/nfsn_deploy"
          [ -n "$NFSN_SSH" ] || unset NFSN_SSH
          scripts/deploy-nfsn.sh
