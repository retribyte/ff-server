name: CI / Deploy

# PRs: typecheck + tests. Push to main: the same, then deploy on the home
# server with scripts/deploy-local.sh (self-hosted runner; scripts/deploy-nfsn.sh is
# the NearlyFreeSpeech failover). See docs/migrate-home-server.md and docs/deploy-nfsn.md.
#
# SCHEMA CHANGES: a PR that changes prisma/schema.prisma adds a SQL file under
# prisma/prod-sql/. The `schema` job lints it and proves on a scratch Postgres that
# it gives exactly the new schema; the deploy then backs up the database and applies
# it on the host before installing the new code. See
# prisma/prod-sql/README.md.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm test
      - run: scripts/test-tag-release.sh

  # PRs only, and a required check: does prisma/prod-sql/ turn the base branch's
  # schema into this branch's schema? (scripts/verify-schema-sql.sh; skips fast
  # when neither the schema nor the SQL changed.)
  schema:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: scripts/test-apply-prod-sql.sh
      - run: scripts/verify-schema-sql.sh "origin/${{ github.base_ref }}"

  # Main only, before the deploy so the build sees the tag: every merge gets the next
  # release tag, a minor or major one if the PR's title or description says [minor] or
  # [major], otherwise a patch. See docs/versioning.md.
  version:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # push the tag
      pull-requests: read
    concurrency:
      group: tag-release-ff-server
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tags
      - name: Tag a release if the merged PR asks for one
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The PR that produced this commit (empty for a direct push)
          PR_TEXT="$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '[.[] | select(.merged_at != null)][0] // empty | "\(.title)\n\n\(.body // "")"')"
          export PR_TEXT
          scripts/tag-release.sh


  # Runs on the home server's self-hosted runner (docs/migrate-home-server.md in
  # ff-server). The repo is public, so NOTHING else may run there: this job only
  # runs for main, and the runner's job-started hook refuses any job that isn't a
  # push or manual run on main of this repo (fork PRs can edit workflows, so the
  # `if:` alone isn't enough). scripts/deploy-nfsn.sh stays as the failover path.
  deploy:
    needs: [test, version]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: [self-hosted, ff-home]
    environment: production
    # Longer than the slowest real path: a migration, plus npm ci when the lockfile
    # changes.
    timeout-minutes: 30
    # One deploy at a time; a newer push waits rather than cancelling mid-install
    concurrency:
      group: deploy-home-ff-server
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, for the version in the build
      # Node 24 is installed system-wide on the box (what production runs)
      - name: Deploy
        run: scripts/deploy-local.sh
